# The backend in one command: the API + the queue worker, both off the same image.
#
#   docker compose up -d --build
#
# There's no database here — DATABASE_URL in .env points at the hosted Postgres
# (Neon), same as `npm run dev` does.

name: nasight

# api and worker are the same image with different commands, so their whole
# service definition is shared from here.
x-server: &server
  build: .
  # One shared tag, so the two services don't each keep their own copy of it.
  image: nasight-server:latest
  restart: unless-stopped
  # All config, DATABASE_URL included, comes from the .env you already have.
  # NOTE: on Neon, set QUEUE_DATABASE_URL to the host WITHOUT "-pooler". pg-boss
  # needs session-level features the pooled endpoint doesn't support, and it
  # silently falls back to the pooled DATABASE_URL when unset.
  env_file: .env
  environment:
    NODE_ENV: ${NODE_ENV:-production}
    # Container-internal port. The published port is API_PORT, below.
    PORT: "8000"
  volumes:
    # Avatars are written to disk, so they need to outlive the container.
    - uploads:/app/uploads

services:
  api:
    <<: *server
    # Migrations run here and only here, so the worker can't race them. The binary
    # is called directly rather than through npx, which needs a writable npm cache.
    command: sh -c "./node_modules/.bin/prisma migrate deploy && node dist/server.js"
    # Host port only — inside the container it's always 8000. Set API_PORT when
    # the host already has something on 8000, which on a shared box it usually does.
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *server
    command: node dist/worker.js
    # Not a real barrier, just ordering: the API applies the migrations.
    depends_on:
      api:
        condition: service_started

volumes:
  uploads:
